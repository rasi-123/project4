<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Check real-time weather anywhere in the world</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput"
                placeholder="Enter city name (e.g. Chennai)">
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <section id="weatherSection" class="hidden">

            <div class="current-weather">

                <div>
                    <h2 id="cityName">City</h2>
                    <p id="currentDate"></p>
                </div>

                <div class="temperature-box">
                    <div id="weatherIcon" class="weather-icon">☀️</div>
                    <h1 id="temperature">--°C</h1>
                    <p id="description">Weather condition</p>
                </div>

                <div class="details">

                    <div class="detail-card">
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <h3 id="feelsLike">--°C</h3>
                    </div>

                    <div class="detail-card">
                        <span>💧</span>
                        <p>Humidity</p>
                        <h3 id="humidity">--%</h3>
                    </div>

                    <div class="detail-card">
                        <span>💨</span>
                        <p>Wind Speed</p>
                        <h3 id="wind">-- km/h</h3>
                    </div>

                </div>

            </div>

            <div class="forecast-section">
                <h2>5-Day Weather Forecast</h2>
                <div id="forecast" class="forecast-container"></div>
            </div>

        </section>

        <footer>
            <p>Weather Dashboard | Powered by Open-Meteo API</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
